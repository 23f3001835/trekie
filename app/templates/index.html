<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trekie</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}"/>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    /* Sidebar layout shared by the admin, staff and user dashboards */
    .side-nav {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 220px;
      padding: 1rem;
      background: #f8f9fa;
      border-right: 1px solid #dee2e6;
      overflow-y: auto;
    }
    .side-main {
      margin-left: 220px;
    }

    /* Status badges: one class per status value, flat Bootstrap colours */
    .badge-open, .badge-active, .badge-completed, .badge-easy {
      background: #198754;
      color: #fff;
    }
    .badge-booked, .badge-approved {
      background: #0d6efd;
      color: #fff;
    }
    .badge-closed, .badge-cancelled, .badge-blacklisted, .badge-hard {
      background: #dc3545;
      color: #fff;
    }
    .badge-pending, .badge-ongoing, .badge-started, .badge-moderate {
      background: #ffc107;
      color: #000;
    }
  </style>
</head>
<body>

  <div id="app"></div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Your JS -->
  <script src="{{ url_for('static', filename='login.js') }}"></script>
  <script src="{{ url_for('static', filename='admin.js') }}"></script>
  <script src="{{ url_for('static', filename='staff.js') }}"></script>
  <script src="{{ url_for('static', filename='user.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
